name: Sync datasets from dmdcosts.co.uk

# Each CSV is built on dmdcosts.co.uk from the data its tool uses; this copies the current files
# here once a month (and on demand) and commits only when something changed.
on:
  schedule:
    - cron: "17 6 2 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the current files
        run: |
          set -u
          for slug in civil-court-fees-history guideline-hourly-rates bank-rate special-account-rate costs-rules-timeline county-court-waiting-times ai-costs-rules-benchmark; do
            if curl -fsS -A "uk-legal-costs-data sync (github.com/Ments123/uk-legal-costs-data)" "https://www.dmdcosts.co.uk/data/${slug}.csv" -o "/tmp/${slug}.csv"; then
              # Keep only well-formed downloads: a header line and at least one row.
              if [ "$(wc -l < "/tmp/${slug}.csv")" -ge 2 ]; then mv "/tmp/${slug}.csv" "data/${slug}.csv"; fi
            else
              echo "skipped ${slug} (not published or not reachable)"
            fi
          done
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "No changes."; else git commit -m "Sync datasets from dmdcosts.co.uk ($(date -u +%Y-%m-%d))" && git push; fi
